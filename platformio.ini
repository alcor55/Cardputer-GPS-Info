[platformio]
src_dir = .
default_envs = cardputer

[env:cardputer]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = post:scripts/package_firmware.py
monitor_speed = 115200
build_src_filter = +<*> -<tests/> -<build/> -<.pio/>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  https://github.com/m5stack/M5Cardputer/archive/refs/tags/1.2.0.zip
  m5stack/M5Unified@0.2.10
  m5stack/M5GFX@0.2.17
  mikalhart/TinyGPSPlus@1.0.3
